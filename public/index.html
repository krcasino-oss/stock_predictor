<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#dfe9f2">
<title>주식전망 예측시스템</title>
<style>
  * { box-sizing: border-box; }
  body {
    background:#dfe9f2; margin:0; padding:12px; font-family: -apple-system, "Malgun Gothic", sans-serif;
    display:flex; justify-content:center;
  }
  .wrap { width:100%; max-width:480px; }
  h1 { font-size:18px; color:#245474; margin:4px 0 12px; text-align:center; }
  .toolbar { display:flex; gap:8px; margin-top:16px; margin-bottom:12px; }
  .btn {
    flex:1; border:none; border-radius:6px; padding:10px; font-size:14px; font-weight:bold;
    color:#fff; background:#7fa8c9; cursor:pointer;
  }
  .btn.refresh { background:#3ecf5e; }
  .btn:disabled { background:#aab6bf; }
  #status { text-align:center; font-size:12px; color:#697783; margin-bottom:10px; min-height:16px; }
  .card {
    background:#e9f1f8; border:1px solid #c6d6e2; border-radius:10px; padding:12px; margin-bottom:10px;
  }
  .card-top { display:flex; justify-content:space-between; align-items:baseline; }
  .name { font-size:15px; font-weight:bold; color:#1d1616; }
  .symbol { font-size:12px; color:#697783; margin-left:4px; }
  .label {
    font-size:13px; font-weight:bold; padding:3px 8px; border-radius:12px; color:#fff;
  }
  .label.STRONG_BUY { background:#ff4d4d; }
  .label.BUY { background:#ff9a9a; }
  .label.HOLD { background:#9bb; }
  .label.SELL { background:#7fa8d6; }
  .label.STRONG_SELL { background:#2c29fc; }
  .row { display:flex; justify-content:space-between; font-size:12px; color:#333; margin-top:6px; }
  .bars { display:flex; gap:4px; margin-top:8px; }
  .bar { flex:1; text-align:center; font-size:10px; color:#697783; }
  .bar .fill { height:6px; border-radius:3px; background:#d8e2ea; position:relative; overflow:hidden; }
  .bar .fill span { position:absolute; top:0; bottom:0; background:#3ecf5e; }
  .error { color:#c0392b; font-size:12px; }
  .asof { font-size:11px; color:#9aa7b0; margin-top:4px; }
  .bar { cursor:pointer; }
  .bar.active .fill { box-shadow:0 0 0 1px #3ecf5e inset; }

  .anomaly { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
  .chip { font-size:10.5px; padding:3px 7px; border-radius:10px; color:#fff; }
  .chip.HIGH { background:#c0392b; }
  .chip.MEDIUM { background:#e08e2b; }
  .candidate-toggle { display:flex; align-items:center; gap:6px; font-size:12px; color:#245474; margin:4px 0 0; }
  .card.is-candidate { border-color:#e08e2b; box-shadow:0 0 0 1px #e08e2b inset; }

  .log-section h2 { font-size:14px; color:#245474; margin:16px 0 6px; }
  .server-ip { font-size:10.5px; font-weight:normal; color:#9aa7b0; }
  .log-hint { font-size:11px; color:#697783; margin-bottom:6px; }
  #logbox {
    background:#f4f8fb; border:1px solid #9bb; border-radius:4px;
    height:420px; overflow-y:auto; padding:6px;
  }
  .log-stock { border-bottom:1px dashed #c6d6e2; padding-bottom:8px; margin-bottom:8px; }
  .log-stock:last-child { border-bottom:none; margin-bottom:0; }
  .log-stock summary {
    font-size:13px; font-weight:bold; color:#1d1616; cursor:pointer; padding:4px 0;
  }
  .log-item { margin:6px 0 6px 4px; padding:6px; border-radius:6px; background:#fff; transition:box-shadow .2s ease; }
  .log-item.highlight { box-shadow:0 0 0 2px #3ecf5e inset; background:#eafff1; }
  .log-item .log-title { font-size:12px; font-weight:bold; color:#245474; }
  .log-item .log-data { font-size:11.5px; color:#555; margin-top:2px; white-space:pre-wrap; }
  .log-item .log-reason { font-size:11.5px; color:#1d1616; margin-top:4px; }
  .log-item .log-reason b { color:#c0392b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📈 주식전망 예측시스템 (2단계)</h1>
  <div id="status"></div>

  <div class="log-section">
    <h2>📋 판단 로그 (데이터 추출방법 · 점수 근거) <span id="serverIp" class="server-ip"></span></h2>
    <div class="log-hint">위 카드의 trend/rsi/macd/bollinger/volume 막대를 누르면 해당 설명으로 바로 이동합니다.</div>
    <div id="logbox"></div>
  </div>

  <label class="candidate-toggle"><input type="checkbox" id="chkCandidatesOnly"> ⚡ 거래량·수급 이상징후 후보만 보기</label>
  <div id="list"></div>

  <div class="toolbar">
    <button class="btn" id="btnRun">예측 실행 (캐시)</button>
    <button class="btn refresh" id="btnRefresh">최신 데이터로 갱신</button>
  </div>
</div>

<script>
const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
const logboxEl = document.getElementById('logbox');
const btnRun = document.getElementById('btnRun');
const btnRefresh = document.getElementById('btnRefresh');
const chkCandidatesOnly = document.getElementById('chkCandidatesOnly');

let lastResults = [];

const INDICATOR_TITLE = {
  trend: '추세(이동평균 정배열/역배열)',
  rsi: 'RSI(상대강도지수, 과매수·과매도)',
  macd: 'MACD(추세 전환·모멘텀)',
  bollinger: '볼린저밴드(변동성 위치)',
  volume: '거래량 배율(평소 대비 관심도)',
};

function setBusy(busy) {
  btnRun.disabled = busy;
  btnRefresh.disabled = busy;
}

function barWidth(score) {
  // score: -2..2 -> 0..100%
  const pct = ((score + 2) / 4) * 100;
  return Math.max(0, Math.min(100, pct));
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderCard(item) {
  if (item.error) {
    return '<div class="card"><div class="card-top"><span class="name">' + item.name + '</span>' +
      '<span class="symbol">' + item.symbol + '</span></div>' +
      '<div class="error">오류: ' + item.error + '</div></div>';
  }
  const s = item.score;
  const ind = item.indicators;
  const bars = Object.entries(s.breakdown).map(([k, v]) => {
    return '<div class="bar" data-symbol="' + item.symbol + '" data-indicator="' + k + '" onclick="focusLog(this)">' +
      '<div class="fill"><span style="left:0;width:' + barWidth(v) + '%"></span></div>' + k + '(' + v + ')</div>';
  }).join('');
  const anomalySignals = item.anomaly?.signals ?? [];
  const chips = anomalySignals.map((sig) => {
    return '<span class="chip ' + sig.level + '">' + escapeHtml(sig.message) + '</span>';
  }).join('');
  const anomalyHtml = chips ? '<div class="anomaly">' + chips + '</div>' : '';
  return '<div class="card' + (item.isCandidate ? ' is-candidate' : '') + '">' +
    '<div class="card-top">' +
      '<span><span class="name">' + item.name + '</span><span class="symbol">' + item.symbol + '</span></span>' +
      '<span class="label ' + s.label + '">' + s.labelKo + '</span>' +
    '</div>' +
    '<div class="row"><span>현재가</span><span>' + Number(ind.lastClose).toLocaleString() + '원</span></div>' +
    '<div class="row"><span>종합점수</span><span>' + s.totalScore + ' / 신뢰도 ' + s.confidence + '%</span></div>' +
    '<div class="bars">' + bars + '</div>' +
    anomalyHtml +
    '<div class="asof">기준일: ' + item.asOf + '</div>' +
  '</div>';
}

function renderLogItem(symbol, key, explainItem) {
  const title = INDICATOR_TITLE[key] || key;
  return '<div class="log-item" id="log-' + symbol + '-' + key + '">' +
    '<div class="log-title">' + title + '</div>' +
    '<div class="log-data">[데이터] ' + escapeHtml(explainItem.data) + '</div>' +
    '<div class="log-reason">[판단] ' + escapeHtml(explainItem.reason) + '</div>' +
  '</div>';
}

function renderLog(results) {
  logboxEl.innerHTML = results.map((item) => {
    if (item.error) {
      return '<details class="log-stock" open><summary>' + item.name + '(' + item.symbol + ')</summary>' +
        '<div class="log-item"><div class="log-reason">오류: ' + escapeHtml(item.error) + '</div></div></details>';
    }
    const s = item.score;
    const items = Object.entries(s.explain).map(([k, v]) => renderLogItem(item.symbol, k, v)).join('');
    const anomalySignals = item.anomaly?.signals ?? [];
    const anomalyItem = anomalySignals.length
      ? '<div class="log-item"><div class="log-title">거래량·수급 이상징후</div>' +
        anomalySignals.map((sig) => '<div class="log-reason">· ' + escapeHtml(sig.message) + '</div>').join('') +
        '</div>'
      : '';
    return '<details class="log-stock" open><summary>' + item.name + '(' + item.symbol + ') · 기준일 ' + item.asOf +
      ' · 종합점수 ' + s.totalScore + '(' + s.labelKo + ')' + (item.isCandidate ? ' · ⚡후보' : '') + '</summary>' +
      items + anomalyItem + '</details>';
  }).join('');
}

function focusLog(barEl) {
  document.querySelectorAll('.bar.active').forEach((el) => el.classList.remove('active'));
  barEl.classList.add('active');
  const { symbol, indicator } = barEl.dataset;
  const target = document.getElementById('log-' + symbol + '-' + indicator);
  if (!target) return;
  const details = target.closest('details');
  if (details) details.open = true;
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.add('highlight');
  setTimeout(() => target.classList.remove('highlight'), 1500);
}

function applyFilter(results) {
  return chkCandidatesOnly.checked ? results.filter((r) => r.isCandidate) : results;
}

function renderAll() {
  const filtered = applyFilter(lastResults);
  listEl.innerHTML = filtered.map(renderCard).join('');
  renderLog(filtered);
}

async function runPredict(refresh) {
  setBusy(true);
  statusEl.textContent = '예측 실행 중... (종목이 많으면 시간이 걸릴 수 있습니다)';
  listEl.innerHTML = '';
  try {
    const res = await fetch('/api/predict' + (refresh ? '?refresh=1' : ''));
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    lastResults = [...data.results].sort((a, b) => (b.score?.totalScore ?? -999) - (a.score?.totalScore ?? -999));
    renderAll();
    statusEl.textContent = '완료: ' + new Date(data.date).toLocaleString('ko-KR');
  } catch (err) {
    statusEl.textContent = '오류: ' + err.message;
  } finally {
    setBusy(false);
  }
}

btnRun.addEventListener('click', () => runPredict(false));
btnRefresh.addEventListener('click', () => runPredict(true));
chkCandidatesOnly.addEventListener('change', renderAll);

async function loadServerInfo() {
  const serverIpEl = document.getElementById('serverIp');
  try {
    const res = await fetch('/api/server-info');
    const data = await res.json();
    serverIpEl.textContent = (data.localIPs || []).join(' · ');
  } catch (err) {
    serverIpEl.textContent = '서버 IP 확인 불가';
  }
}

loadServerInfo();
// 페이지 로드시 캐시 기반으로 자동 1회 실행
runPredict(false);
</script>
</body>
</html>
