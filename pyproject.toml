[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-predictor"
version = "0.1.0"
description = "단타공방(kb-trading-bot)과 별도로 개발하는 주식전망 예측시스템 (2단계)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "finance-datareader>=0.9.50",
]

[project.scripts]
stock-predict = "stock_predictor.predict:main"

[tool.setuptools.packages.find]
where = ["src"]
